backend:
  replicaCount: 1
  image:
    repository: devopsfinal-backend
    tag: latest
    pullPolicy: Never
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

frontend:
  replicaCount: 1
  image:
    repository: devopsfinal-frontend
    tag: latest
    pullPolicy: Never
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

hpa:
  enabled: false
